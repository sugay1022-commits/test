<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI営業コーチング PoC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1f3a5f;
      --navy-dark: #16293f;
      --gold: #c8a04d;
      --bg: #f2f4f7;
      --border: #dde3ea;
      --shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--navy);
      color: #fff;
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      flex-shrink: 0;
      z-index: 10;
    }
    header .logo { font-size: 1.4rem; }
    header h1 { font-size: 1.05rem; font-weight: 700; }
    header .sub { font-size: 0.7rem; opacity: 0.75; margin-top: 1px; }
    .mode-badge {
      margin-left: auto;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .mode-badge.claude { background: rgba(255,255,255,0.18); }
    .mode-badge.demo   { background: rgba(255,200,0,0.25); color: #ffe066; }
    .btn-export {
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--gold);
      color: #2a2210;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-export:hover { opacity: 0.9; }

    .main { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 260px;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 14px;
      font-size: 0.78rem;
      color: #444;
    }
    .sidebar h2 { font-size: 0.8rem; color: var(--navy); margin-bottom: 8px; }
    .sidebar ul { list-style: none; margin-bottom: 16px; }
    .sidebar li { padding: 4px 0; border-bottom: 1px dashed #eee; line-height: 1.5; }
    .pb-item { padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
    .pb-item .pb-type { display: inline-block; font-size: 0.65rem; background: var(--navy); color: #fff; border-radius: 4px; padding: 1px 6px; margin-bottom: 3px; }
    .pb-item .pb-title { font-weight: 600; color: #333; }

    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }

    .report-form {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      max-width: 560px;
      box-shadow: var(--shadow);
      margin: auto;
    }
    .report-form h2 { font-size: 1rem; color: var(--navy); margin-bottom: 4px; }
    .report-form p { font-size: 0.8rem; color: #777; margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .form-row label { font-size: 0.75rem; color: #555; display: block; margin-bottom: 4px; }
    .form-row select, .form-row input {
      width: 100%; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.85rem;
    }
    .form-col { flex: 1; min-width: 120px; }
    .form-textarea {
      width: 100%; min-height: 90px; padding: 8px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.85rem; font-family: inherit; resize: vertical;
    }
    .btn-primary {
      background: var(--navy); color: #fff; border: none; border-radius: 8px;
      padding: 9px 20px; font-size: 0.88rem; cursor: pointer; margin-top: 10px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--navy-dark); }
    .btn-primary:disabled { background: #9aa6b5; cursor: not-allowed; }

    .msg { display: flex; gap: 9px; max-width: 720px; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0; margin-top: 2px;
    }
    .msg.user .avatar { background: #1976d2; color: #fff; }
    .msg.bot .avatar { background: var(--navy); color: #fff; }
    .bubble {
      padding: 10px 14px; border-radius: 14px; line-height: 1.65;
      font-size: 0.88rem; max-width: 580px; word-break: break-word; white-space: pre-wrap;
    }
    .msg.user .bubble { background: #1976d2; color: #fff; border-bottom-right-radius: 3px; }
    .msg.bot .bubble { background: #fff; color: #222; border-bottom-left-radius: 3px; box-shadow: var(--shadow); }
    .bubble.typing::after { content: '▋'; animation: blink 0.6s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .meta-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .tag {
      font-size: 0.68rem; padding: 2px 8px; border-radius: 10px; background: #eef1f5; color: #555;
    }
    .tag.intervention { background: #fde2e2; color: #b3261e; font-weight: 700; }

    .input-area {
      background: #fff; border-top: 1px solid var(--border);
      padding: 12px 16px; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
    }
    textarea#input {
      flex: 1; border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px;
      font-size: 0.88rem; font-family: inherit; resize: none; outline: none; line-height: 1.5; max-height: 100px;
    }
    textarea#input:focus { border-color: var(--navy); }
    .btn-send {
      background: var(--navy); color: #fff; border: none; border-radius: 10px;
      padding: 0 18px; height: 40px; font-size: 0.88rem; cursor: pointer; white-space: nowrap;
    }
    .btn-send:hover:not(:disabled) { background: var(--navy-dark); }
    .btn-send:disabled { background: #9aa6b5; cursor: not-allowed; }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">🧭</span>
    <div>
      <h1>AI営業コーチング PoC</h1>
      <div class="sub">活動報告 → AIコーチによる即時フィードバック</div>
    </div>
    <span class="mode-badge" id="mode-badge">...</span>
    <button class="btn-export" onclick="exportLogs()">📊 ログ出力</button>
  </header>

  <div class="main">
    <nav class="sidebar">
      <h2>📐 フィードバック評価軸</h2>
      <ul id="axes-list"></ul>
      <h2>📘 playbook（参照ノウハウ）</h2>
      <div id="playbook-list"></div>
    </nav>

    <div class="chat-area">
      <div class="chat-messages" id="chat">
        <div class="report-form" id="report-form">
          <h2>活動報告フォーム</h2>
          <p>本日の活動について報告してください。AIコーチが上長視点でフィードバックします。</p>
          <div class="form-row">
            <div class="form-col">
              <label>顧客区分</label>
              <select id="customerType">
                <option value="個人・既契約">個人・既契約</option>
                <option value="個人・新規">個人・新規</option>
                <option value="法人・既契約">法人・既契約</option>
                <option value="法人・新規">法人・新規</option>
              </select>
            </div>
            <div class="form-col">
              <label>活動種別</label>
              <select id="activityType">
                <option value="訪問">訪問</option>
                <option value="架電">架電</option>
                <option value="提案">提案</option>
                <option value="契約">契約</option>
                <option value="フォロー">フォロー</option>
              </select>
            </div>
            <div class="form-col">
              <label>見込み度</label>
              <select id="prospectLevel">
                <option value="高">高</option>
                <option value="中" selected>中</option>
                <option value="低">低</option>
              </select>
            </div>
          </div>
          <label>活動報告・相談内容</label>
          <textarea class="form-textarea" id="report-text" placeholder="例：本日◯◯様を訪問し、更新時期の契約内容を確認した。新たな提案には反応が薄く、検討すると言われた。"></textarea>
          <button class="btn-primary" id="submit-report" onclick="submitReport()">報告する</button>
        </div>
      </div>

      <div class="input-area hidden" id="input-area">
        <textarea id="input" rows="1" placeholder="AIコーチへの追加の相談を入力（Shift+Enterで改行）"></textarea>
        <button class="btn-send" id="send-btn" onclick="sendFollowUp()">送信</button>
      </div>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const modeBadge = document.getElementById('mode-badge');
    const axesList = document.getElementById('axes-list');
    const playbookList = document.getElementById('playbook-list');
    const reportForm = document.getElementById('report-form');
    const inputArea = document.getElementById('input-area');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const submitBtn = document.getElementById('submit-report');

    let history = [];
    let reportMeta = null;
    let busy = false;

    async function init() {
      const meta = await fetch('/api/meta').then(r => r.json());
      if (meta.mode === 'claude') {
        modeBadge.textContent = '✅ Claudeモード';
        modeBadge.className = 'mode-badge claude';
      } else {
        modeBadge.textContent = '🔶 デモモード';
        modeBadge.className = 'mode-badge demo';
      }
      for (const axis of meta.evaluationAxes) {
        const li = document.createElement('li');
        li.textContent = axis;
        axesList.appendChild(li);
      }

      const playbook = await fetch('/api/playbook').then(r => r.json());
      const all = [
        ...(playbook.winningPatterns || []).map(p => ({ type: '勝ちパターン', title: p.title })),
        ...(playbook.talkScripts || []).map(p => ({ type: 'トークスクリプト', title: p.scene })),
        ...(playbook.objectionHandling || []).map(p => ({ type: '反論対応', title: p.objection })),
      ];
      for (const item of all) {
        const div = document.createElement('div');
        div.className = 'pb-item';
        div.innerHTML = `<span class="pb-type">${item.type}</span><div class="pb-title">${item.title}</div>`;
        playbookList.appendChild(div);
      }
    }

    function addMessage(role, text, streaming = false) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = role === 'user' ? '👤' : '🧭';
      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (streaming ? ' typing' : '');
      bubble.textContent = text;
      wrap.appendChild(av);
      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return wrap;
    }

    function addMetaTags(wrap, data) {
      const tags = document.createElement('div');
      tags.className = 'meta-tags';
      if (data.intervention && data.intervention.flag) {
        const t = document.createElement('span');
        t.className = 'tag intervention';
        t.textContent = '⚠ 上長エスカレーション推奨: ' + data.intervention.reason;
        tags.appendChild(t);
      }
      for (const item of (data.playbookItemsUsed || [])) {
        const t = document.createElement('span');
        t.className = 'tag';
        t.textContent = `📘 ${item.type}: ${item.title}`;
        tags.appendChild(t);
      }
      if (tags.children.length > 0) wrap.appendChild(tags);
    }

    async function postReport(message) {
      const res = await fetch('/api/report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          reporterId: 'demo-user',
          ...reportMeta,
          message,
          history,
        }),
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'エラーが発生しました');
      }
      return res.json();
    }

    async function submitReport() {
      const text = document.getElementById('report-text').value.trim();
      if (!text || busy) return;
      busy = true;
      submitBtn.disabled = true;

      reportMeta = {
        customerType: document.getElementById('customerType').value,
        activityType: document.getElementById('activityType').value,
        prospectLevel: document.getElementById('prospectLevel').value,
      };

      reportForm.classList.add('hidden');
      addMessage('user', text);
      history.push({ role: 'user', content: text });

      const botWrap = addMessage('bot', 'コーチが確認しています…', true);

      try {
        const data = await postReport(text);
        const bubble = botWrap.querySelector('.bubble');
        bubble.classList.remove('typing');
        bubble.textContent = data.reply;
        addMetaTags(botWrap, data);
        history.push({ role: 'assistant', content: data.reply });
        inputArea.classList.remove('hidden');
        inputEl.focus();
      } catch (err) {
        const bubble = botWrap.querySelector('.bubble');
        bubble.classList.remove('typing');
        bubble.textContent = '❌ ' + err.message;
      } finally {
        busy = false;
        submitBtn.disabled = false;
      }
    }

    async function sendFollowUp() {
      const text = inputEl.value.trim();
      if (!text || busy) return;
      busy = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      addMessage('user', text);
      history.push({ role: 'user', content: text });

      const botWrap = addMessage('bot', '考えています…', true);

      try {
        const data = await postReport(text);
        const bubble = botWrap.querySelector('.bubble');
        bubble.classList.remove('typing');
        bubble.textContent = data.reply;
        addMetaTags(botWrap, data);
        history.push({ role: 'assistant', content: data.reply });
      } catch (err) {
        const bubble = botWrap.querySelector('.bubble');
        bubble.classList.remove('typing');
        bubble.textContent = '❌ ' + err.message;
      } finally {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFollowUp(); }
    });

    function exportLogs() {
      window.location.href = '/api/logs/export';
    }

    init();
  </script>
</body>
</html>
