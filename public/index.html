<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食品物流センター Q&Aチャットボット</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a6b3c;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      flex-shrink: 0;
    }
    header .icon { font-size: 1.6rem; }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.03em; }
    header .sub { font-size: 0.78rem; opacity: 0.8; margin-top: 2px; }
    header .kb-info {
      margin-left: auto;
      font-size: 0.75rem;
      opacity: 0.85;
      background: rgba(255,255,255,0.15);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 820px;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot  { align-self: flex-start; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .message.user .avatar { background: #2196f3; color: #fff; }
    .message.bot  .avatar { background: #1a6b3c; color: #fff; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.65;
      font-size: 0.93rem;
      max-width: 650px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .message.user .bubble {
      background: #2196f3;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.bot .bubble {
      background: #fff;
      color: #222;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .bubble.typing::after {
      content: '▋';
      animation: blink 0.7s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .welcome {
      align-self: center;
      text-align: center;
      color: #666;
      padding: 30px 20px;
    }
    .welcome .big-icon { font-size: 3rem; margin-bottom: 10px; }
    .welcome h2 { font-size: 1.1rem; color: #1a6b3c; margin-bottom: 8px; }
    .welcome p { font-size: 0.88rem; line-height: 1.7; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }
    .suggestion-btn {
      background: #fff;
      border: 1.5px solid #1a6b3c;
      color: #1a6b3c;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .suggestion-btn:hover { background: #1a6b3c; color: #fff; }

    .input-area {
      background: #fff;
      border-top: 1px solid #dde3ea;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      border: 1.5px solid #c8d4de;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.93rem;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 120px;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #1a6b3c; }
    textarea::placeholder { color: #aaa; }

    button#send-btn {
      background: #1a6b3c;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 0.93rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      height: 44px;
    }
    button#send-btn:hover:not(:disabled) { background: #155c32; }
    button#send-btn:active:not(:disabled) { transform: scale(0.97); }
    button#send-btn:disabled { background: #9cbfad; cursor: not-allowed; }

    .reload-btn {
      background: transparent;
      border: 1px solid #aaa;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
      height: 44px;
    }
    .reload-btn:hover { border-color: #1a6b3c; color: #1a6b3c; }
  </style>
</head>
<body>
  <header>
    <span class="icon">🏭</span>
    <div>
      <h1>食品物流センター Q&Aチャットボット</h1>
      <div class="sub">ナレッジベースに基づいてご質問にお答えします</div>
    </div>
    <div class="kb-info" id="kb-info">読み込み中...</div>
  </header>

  <div class="chat-container" id="chat">
    <div class="welcome">
      <div class="big-icon">🥦🚚📦</div>
      <h2>食品物流センター サポートチャット</h2>
      <p>業務に関するご質問をどうぞ。<br>ナレッジベースを元にAIが回答します。</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion(this)">温度管理のルールは？</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">賞味期限の確認方法</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">入荷検品の手順</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">緊急時の連絡先</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">フォークリフトの安全確認</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" rows="1" placeholder="質問を入力してください（例: 冷蔵品の保管温度は？）"></textarea>
    <button class="reload-btn" onclick="reloadKB()" title="ナレッジベース再読み込み">🔄</button>
    <button id="send-btn" onclick="sendMessage()">送信</button>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const kbInfo = document.getElementById('kb-info');
    let history = [];
    let isStreaming = false;

    // ナレッジ件数を取得
    fetch('/api/knowledge-count')
      .then(r => r.json())
      .then(d => { kbInfo.textContent = `KB: ${d.count} 件`; })
      .catch(() => { kbInfo.textContent = 'KB: 不明'; });

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    function addMessage(role, text, streaming = false) {
      // ウェルカム画面を消す
      const welcome = chatEl.querySelector('.welcome');
      if (welcome) welcome.remove();

      const wrap = document.createElement('div');
      wrap.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '👤' : '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (streaming ? ' typing' : '');
      bubble.textContent = text;

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isStreaming) return;

      isStreaming = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      addMessage('user', text);
      history.push({ role: 'user', content: text });

      const botBubble = addMessage('bot', '', true);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
        });

        if (!res.ok) {
          const err = await res.json();
          botBubble.classList.remove('typing');
          botBubble.textContent = '❌ エラー: ' + (err.error || '不明なエラー');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const json = line.slice(6);
            try {
              const data = JSON.parse(json);
              if (data.text) {
                fullText += data.text;
                botBubble.textContent = fullText;
                chatEl.scrollTop = chatEl.scrollHeight;
              } else if (data.done) {
                botBubble.classList.remove('typing');
                history.push({ role: 'assistant', content: fullText });
              } else if (data.error) {
                botBubble.classList.remove('typing');
                botBubble.textContent = '❌ ' + data.error;
              }
            } catch {}
          }
        }
        botBubble.classList.remove('typing');
      } catch (err) {
        botBubble.classList.remove('typing');
        botBubble.textContent = '❌ 通信エラーが発生しました: ' + err.message;
      } finally {
        isStreaming = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function sendSuggestion(btn) {
      inputEl.value = btn.textContent;
      sendMessage();
    }

    async function reloadKB() {
      const res = await fetch('/api/reload', { method: 'POST' });
      const data = await res.json();
      kbInfo.textContent = `KB: ${data.count} 件`;
      alert(data.message);
    }
  </script>
</body>
</html>
