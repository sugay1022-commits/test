<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食品物流センター Q&Aチャットボット</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1a6b3c;
      --green-dark: #125430;
      --green-light: #e8f5ee;
      --blue: #1976d2;
      --gray-bg: #f0f4f8;
      --gray-border: #dde3ea;
      --shadow: 0 1px 6px rgba(0,0,0,0.1);
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: var(--gray-bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      background: var(--green);
      color: #fff;
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      flex-shrink: 0;
      z-index: 10;
    }
    header .logo { font-size: 1.5rem; }
    header h1 { font-size: 1.05rem; font-weight: 700; }
    header .sub { font-size: 0.72rem; opacity: 0.8; margin-top: 1px; }
    .mode-badge {
      margin-left: auto;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .mode-badge.claude { background: rgba(255,255,255,0.2); }
    .mode-badge.demo   { background: rgba(255,200,0,0.3); color: #ffe066; }
    .kb-count {
      font-size: 0.72rem;
      opacity: 0.8;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
    }

    /* メインレイアウト */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* サイドバー */
    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid var(--gray-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 12px 14px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--gray-border);
    }
    .category-list {
      overflow-y: auto;
      flex: 1;
    }
    .cat-item {
      padding: 9px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #444;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
      border-bottom: 1px solid #f0f0f0;
    }
    .cat-item:hover { background: var(--green-light); }
    .cat-item.active { background: var(--green-light); color: var(--green); font-weight: 600; }
    .cat-icon { font-size: 1rem; width: 20px; text-align: center; }

    /* Q&Aパネル */
    .qa-panel {
      width: 280px;
      background: #fafbfc;
      border-right: 1px solid var(--gray-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: width 0.2s;
    }
    .qa-panel.hidden { width: 0; border: none; }
    .qa-panel-header {
      padding: 10px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--green);
      border-bottom: 1px solid var(--gray-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .qa-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px;
    }
    .qa-card {
      background: #fff;
      border: 1px solid var(--gray-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .qa-card:hover { box-shadow: var(--shadow); border-color: #bcd4c8; }
    .qa-card .q { font-size: 0.8rem; font-weight: 600; color: #333; margin-bottom: 4px; }
    .qa-card .a { font-size: 0.75rem; color: #666; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* チャットエリア */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* ウェルカム */
    .welcome {
      margin: auto;
      text-align: center;
      color: #666;
      padding: 20px;
      max-width: 420px;
    }
    .welcome .big-icon { font-size: 3rem; margin-bottom: 10px; }
    .welcome h2 { font-size: 1.05rem; color: var(--green); margin-bottom: 8px; }
    .welcome p { font-size: 0.85rem; line-height: 1.7; }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin-top: 14px;
    }
    .sug-btn {
      background: #fff;
      border: 1.5px solid var(--green);
      color: var(--green);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sug-btn:hover { background: var(--green); color: #fff; }

    /* メッセージ */
    .msg {
      display: flex;
      gap: 9px;
      max-width: 720px;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg.user .avatar { background: var(--blue); color: #fff; }
    .msg.bot  .avatar { background: var(--green); color: #fff; }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.65;
      font-size: 0.88rem;
      max-width: 580px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.user .bubble {
      background: var(--blue);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .msg.bot .bubble {
      background: #fff;
      color: #222;
      border-bottom-left-radius: 3px;
      box-shadow: var(--shadow);
    }
    .bubble.typing::after {
      content: '▋';
      animation: blink 0.6s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* 入力エリア */
    .input-area {
      background: #fff;
      border-top: 1px solid var(--gray-border);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      border: 1.5px solid var(--gray-border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.88rem;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 100px;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--green); }
    textarea::placeholder { color: #bbb; }

    .btn-send {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      height: 40px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-send:hover:not(:disabled) { background: var(--green-dark); }
    .btn-send:disabled { background: #9cbfad; cursor: not-allowed; }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--gray-border);
      border-radius: 8px;
      height: 40px;
      width: 40px;
      font-size: 1rem;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-icon:hover { border-color: var(--green); color: var(--green); }

    /* スクロールバー */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c8d4de; border-radius: 4px; }

    @media (max-width: 768px) {
      .sidebar, .qa-panel { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">🏭</span>
    <div>
      <h1>食品物流センター Q&Aチャットボット</h1>
      <div class="sub">ナレッジベースに基づいてご質問にお答えします</div>
    </div>
    <span class="kb-count" id="kb-count">KB: 読み込み中</span>
    <span class="mode-badge" id="mode-badge">...</span>
  </header>

  <div class="main">
    <!-- カテゴリサイドバー -->
    <nav class="sidebar">
      <div class="sidebar-header">📂 カテゴリ</div>
      <div class="category-list" id="cat-list">
        <div class="cat-item active" data-cat="" onclick="selectCategory(this, '')">
          <span class="cat-icon">📋</span>すべて
        </div>
      </div>
    </nav>

    <!-- Q&Aパネル -->
    <div class="qa-panel" id="qa-panel">
      <div class="qa-panel-header">
        <span id="qa-panel-title">Q&A一覧</span>
        <span style="font-size:0.72rem;color:#888" id="qa-count"></span>
      </div>
      <div class="qa-list" id="qa-list"></div>
    </div>

    <!-- チャットエリア -->
    <div class="chat-area">
      <div class="chat-messages" id="chat">
        <div class="welcome" id="welcome">
          <div class="big-icon">🥦🚚📦</div>
          <h2>食品物流センター サポートチャット</h2>
          <p>業務に関するご質問をどうぞ。<br>左のカテゴリからQ&Aを参照するか、<br>チャットで質問してください。</p>
          <div class="suggestions">
            <button class="sug-btn" onclick="sendSug(this)">冷蔵品の保管温度は？</button>
            <button class="sug-btn" onclick="sendSug(this)">入荷検品の手順</button>
            <button class="sug-btn" onclick="sendSug(this)">フォークリフトの安全確認</button>
            <button class="sug-btn" onclick="sendSug(this)">火災発生時の対応</button>
            <button class="sug-btn" onclick="sendSug(this)">賞味期限の管理方法</button>
            <button class="sug-btn" onclick="sendSug(this)">内線番号一覧</button>
          </div>
        </div>
      </div>

      <div class="input-area">
        <textarea id="input" rows="1" placeholder="質問を入力（例：冷凍品の温度管理は？）"></textarea>
        <button class="btn-icon" onclick="reloadKB()" title="KB再読込">🔄</button>
        <button class="btn-send" id="send-btn" onclick="sendMessage()">送信</button>
      </div>
    </div>
  </div>

  <script>
    const chatEl   = document.getElementById('chat');
    const inputEl  = document.getElementById('input');
    const sendBtn  = document.getElementById('send-btn');
    const kbCount  = document.getElementById('kb-count');
    const modeBadge = document.getElementById('mode-badge');
    const qaPanel  = document.getElementById('qa-panel');
    const qaList   = document.getElementById('qa-list');
    const qaTitle  = document.getElementById('qa-panel-title');
    const qaCountEl = document.getElementById('qa-count');
    const catList  = document.getElementById('cat-list');

    let history = [];
    let isStreaming = false;
    const catIcons = {
      '温度管理': '🌡️', '入出荷': '📦', '安全・衛生': '🦺',
      '在庫管理': '📊', '緊急対応': '🚨', '業務ルール': '📋',
      '施設・設備': '🏢', '一般': '📌',
    };

    // 初期化
    async function init() {
      const res = await fetch('/api/knowledge-count').then(r => r.json());
      kbCount.textContent = `KB: ${res.count} 件`;
      if (res.mode === 'claude') {
        modeBadge.textContent = '✅ Claude RAGモード';
        modeBadge.className = 'mode-badge claude';
      } else {
        modeBadge.textContent = '🔶 デモモード';
        modeBadge.className = 'mode-badge demo';
      }
      loadCategories();
      loadQA('');
    }

    async function loadCategories() {
      const { categories } = await fetch('/api/categories').then(r => r.json());
      for (const cat of categories) {
        const div = document.createElement('div');
        div.className = 'cat-item';
        div.dataset.cat = cat;
        div.innerHTML = `<span class="cat-icon">${catIcons[cat] || '📌'}</span>${cat}`;
        div.onclick = () => selectCategory(div, cat);
        catList.appendChild(div);
      }
    }

    async function loadQA(category) {
      const url = '/api/qa' + (category ? `?category=${encodeURIComponent(category)}` : '');
      const { items } = await fetch(url).then(r => r.json());
      qaList.innerHTML = '';
      qaCountEl.textContent = `${items.length} 件`;
      qaTitle.textContent = category || 'すべてのQ&A';
      for (const item of items) {
        const card = document.createElement('div');
        card.className = 'qa-card';
        card.innerHTML = `<div class="q">Q: ${item.question}</div><div class="a">${item.answer}</div>`;
        card.onclick = () => {
          inputEl.value = item.question;
          sendMessage();
        };
        qaList.appendChild(card);
      }
    }

    function selectCategory(el, cat) {
      document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      loadQA(cat);
    }

    // テキストエリア自動リサイズ
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function removeWelcome() {
      const w = document.getElementById('welcome');
      if (w) w.remove();
    }

    function addMessage(role, text, streaming = false) {
      removeWelcome();
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = role === 'user' ? '👤' : '🤖';
      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (streaming ? ' typing' : '');
      bubble.textContent = text;
      wrap.appendChild(av);
      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isStreaming) return;

      isStreaming = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      addMessage('user', text);
      history.push({ role: 'user', content: text });

      const botBubble = addMessage('bot', '', true);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
        });

        if (!res.ok) {
          const err = await res.json();
          botBubble.classList.remove('typing');
          botBubble.textContent = '❌ ' + (err.error || 'エラーが発生しました');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try {
              const data = JSON.parse(line.slice(6));
              if (data.text) {
                fullText += data.text;
                botBubble.textContent = fullText;
                chatEl.scrollTop = chatEl.scrollHeight;
              } else if (data.done) {
                botBubble.classList.remove('typing');
                history.push({ role: 'assistant', content: fullText });
              } else if (data.error) {
                botBubble.classList.remove('typing');
                botBubble.textContent = '❌ ' + data.error;
              }
            } catch {}
          }
        }
        botBubble.classList.remove('typing');
      } catch (err) {
        botBubble.classList.remove('typing');
        botBubble.textContent = '❌ 通信エラー: ' + err.message;
      } finally {
        isStreaming = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function sendSug(btn) {
      inputEl.value = btn.textContent;
      sendMessage();
    }

    async function reloadKB() {
      const res = await fetch('/api/reload', { method: 'POST' });
      const data = await res.json();
      kbCount.textContent = `KB: ${data.count} 件`;
      loadCategories();
      loadQA('');
    }

    init();
  </script>
</body>
</html>
